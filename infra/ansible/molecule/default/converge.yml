---
- name: Converge
  hosts: all
  tasks:
    - name: Include scheduled-job (systemd timer) tasks (no DO provisioning or Docker in molecule)
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/deploy/systemd_jobs.yml"
      vars:
        foray_app_image: ghcr.io/jahrik/foray-planner:latest
        foray_app_container_name: foray-planner
        foray_do_db_name: foray
        foray_db_host: localhost
        foray_db_port: "5432"
        foray_db_user: foray
        foray_db_password: testpass
        foray_ridb_api_key: ""
        foray_home_lat: "47.6062"
        foray_home_lng: "-122.3321"
        foray_home_radius_km: "150"
        foray_night_window_start_hour: "2"
        foray_night_window_tz: America/Los_Angeles
        foray_night_window_randomized_delay_sec: "10800"
        foray_job_randomized_delay_sec: "300"
        # jobs.yaml lives at the repo root; MOLECULE_PROJECT_DIRECTORY is infra/ansible.
        foray_jobs_manifest_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../jobs.yaml"
