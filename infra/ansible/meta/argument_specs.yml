---
argument_specs:
  main:
    short_description: Deploy foray-planner to Digital Ocean
    options:
      foray_do_token:
        type: str
        description: Digital Ocean API token (read from DO_API_TOKEN env var)
        required: true
      foray_do_region:
        type: str
        description: DO region for all resources
        default: sfo3
      foray_do_droplet_name:
        type: str
        description: Droplet hostname
        default: foray-planner
      foray_do_droplet_size:
        type: str
        description: Droplet size slug
        default: s-1vcpu-2gb
      foray_do_droplet_image:
        type: str
        description: Droplet image slug (must have Docker pre-installed)
        default: docker-20-04
      foray_do_ssh_key_name:
        type: str
        description: Name of the SSH key registered in DO (must exist)
        required: true
      foray_do_db_cluster_name:
        type: str
        description: Managed Postgres cluster name
        default: foray-postgres
      foray_do_db_size:
        type: str
        description: >-
          Managed database size slug. Only affects a fresh cluster create or an explicit
          `foray:db-resize` run - database_cluster's `present()` never diffs/updates size on an
          existing cluster.
        default: db-s-1vcpu-1gb
      foray_do_db_version:
        type: str
        description: Postgres major version
        default: "17"
      foray_do_db_name:
        type: str
        description: Database name to create within the cluster
        default: foray
      foray_app_image:
        type: str
        description: Container image (GHCR)
        default: ghcr.io/jahrik/foray-planner:latest
      foray_app_container_name:
        type: str
        description: Docker container name on the host
        default: foray-planner
      foray_docker_network:
        type: str
        description: Docker network shared by the app and caddy containers
        default: foray-net
      foray_domain:
        type: str
        description: Public domain name Caddy terminates TLS for
        default: forayplanner.com
      foray_caddy_container_name:
        type: str
        description: Caddy container name on the host
        default: foray-planner-caddy
      foray_caddy_image:
        type: str
        description: Caddy container image
        default: caddy:2-alpine
      foray_tls_cert_path:
        type: str
        description: >-
          Local path to the Cloudflare Origin CA certificate (read from FORAY_TLS_CERT_PATH env
          var). Either this + foray_tls_key_path, or foray_tls_cert_content + foray_tls_key_content,
          must be set.
        default: ""
      foray_tls_key_path:
        type: str
        description: >-
          Local path to the Cloudflare Origin CA private key (read from FORAY_TLS_KEY_PATH env
          var). Either this + foray_tls_cert_path, or foray_tls_cert_content + foray_tls_key_content,
          must be set.
        default: ""
      foray_tls_cert_content:
        type: str
        description: >-
          Cloudflare Origin CA certificate content, inline (read from FORAY_TLS_CERT env var) -
          used by CI in place of foray_tls_cert_path, which needs a local file.
        default: ""
      foray_tls_key_content:
        type: str
        description: >-
          Cloudflare Origin CA private key content, inline (read from FORAY_TLS_KEY env var) -
          used by CI in place of foray_tls_key_path, which needs a local file.
        default: ""
      foray_ridb_api_key:
        type: str
        description: Recreation.gov API key (optional, campground ingest skipped without it)
        default: ""
      foray_home_lat:
        type: str
        description: Default home latitude
        default: "47.6062"
      foray_home_lng:
        type: str
        description: Default home longitude
        default: "-122.3321"
      foray_home_radius_km:
        type: str
        description: Default search radius in km
        default: "150"
      foray_basemap_url:
        type: str
        description: >
          URL of the Protomaps PMTiles vector basemap archive (the map's only base layer).
          FORAY_BASEMAP_URL wins; otherwise defaults to the computed CDN URL once the Spaces
          key is set, else empty (map has no base layer).
        default: ""
      foray_terrain_url:
        type: str
        description: >
          Terrarium DEM tile URL template (drives hillshade + contours). Defaults to AWS Open
          Data's elevation-tiles-prod; set FORAY_TERRAIN_URL to override (self-hosted archive,
          or "" to drop hillshade).
        default: "https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png"
      foray_spaces_access_key_id:
        type: str
        description: DO Spaces access key id (API -> Spaces Keys, separate from DO_API_TOKEN); read from DO_SPACES_KEY. Empty skips basemap Space provisioning.
        default: ""
      foray_spaces_secret_access_key:
        type: str
        description: DO Spaces secret access key; read from DO_SPACES_SECRET.
        default: ""
      foray_basemap_space_name:
        type: str
        description: Name of the DO Space that holds the basemap archive
        default: foray-basemap
      foray_basemap_region:
        type: str
        description: DO region for the basemap Space (defaults to foray_do_region)
        default: "{{ foray_do_region }}"
      foray_basemap_object_key:
        type: str
        description: Object key of the PMTiles archive in the Space
        default: us.pmtiles
      foray_basemap_bbox:
        type: str
        description: "min_lon,min_lat,max_lon,max_lat the archive covers (CONUS default)"
        default: "-125,24,-66,50"
      foray_basemap_cdn_ttl:
        type: str
        description: CDN edge cache TTL in seconds, also the archive's Cache-Control max-age
        default: "86400"
      foray_basemap_source:
        type: str
        description: Planet build to slice from; empty auto-picks the latest build.protomaps.com daily
        default: ""
      foray_pmtiles_version:
        type: str
        description: github.com/protomaps/go-pmtiles CLI version used for the extract
        default: "1.31.2"
      foray_basemap_workdir:
        type: str
        description: Control-node directory for the pmtiles CLI and the extract output
        default: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/foray-basemap"
      foray_ingest_cron_hour:
        type: str
        description: Hour (UTC) for daily observation ingest cron
        default: "4"
      foray_ingest_cron_minute:
        type: str
        description: Minute for daily observation ingest cron
        default: "0"
      foray_layers_cron_hour:
        type: str
        description: Hour (UTC) for weekly layers refresh cron
        default: "3"
      foray_layers_cron_minute:
        type: str
        description: Minute for weekly layers refresh cron
        default: "0"
      foray_layers_cron_weekday:
        type: str
        description: Day of week (0=Sunday) for weekly layers refresh
        default: "0"
      foray_genera_cron_hour:
        type: str
        description: Hour (UTC) for weekly Fungi genus catalog refresh
        default: "2"
      foray_genera_cron_minute:
        type: str
        description: Minute for weekly Fungi genus catalog refresh
        default: "0"
      foray_genera_cron_weekday:
        type: str
        description: Day of week (0=Sunday) for weekly Fungi genus catalog refresh
        default: "0"
      foray_revalidate_cron_hour:
        type: str
        description: Hour (UTC) for weekly genus-drift revalidate cron
        default: "5"
      foray_revalidate_cron_minute:
        type: str
        description: Minute for weekly genus-drift revalidate cron
        default: "0"
      foray_revalidate_cron_weekday:
        type: str
        description: Day of week (0=Sunday) for weekly genus-drift revalidate cron
        default: "0"
      foray_resync_cron_minute:
        type: str
        description: Minute (every hour) for hourly observation resync cron
        default: "30"
      foray_resync_batch_size:
        type: str
        description: Row batch size for the recurring (non-catch-up) observation resync cron
        default: "2000"
      foray_elevation_cron_minute:
        type: str
        description: Minute (every hour) for the hourly elevation backfill cron
        default: "45"
      foray_elevation_backfill_limit:
        type: str
        description: Upper bound on observations enriched per elevation backfill run (it stops
          earlier when Open-Meteo's free tier rate-limits it)
        default: "20000"
      foray_resync_once_batch_size:
        type: str
        description: Row batch size for the one-time foray:resync-once catch-up run
        default: "20000"
      foray_alert_email:
        type: str
        description: DO monitoring alert recipient (read from FORAY_ALERT_EMAIL env var); unset skips alert policy creation
        default: ""
      foray_disk_alert_threshold_percent:
        type: int
        description: Droplet disk-usage percent that triggers a DO monitoring alert
        default: 85
      foray_cpu_alert_threshold_percent:
        type: int
        description: Droplet CPU-usage percent that triggers a DO monitoring alert
        default: 90
      foray_memory_alert_threshold_percent:
        type: int
        description: Droplet memory-usage percent that triggers a DO monitoring alert
        default: 90
      foray_pg_log_min_duration_ms:
        type: int
        description: log_min_duration_statement threshold in ms, applied every foray:provision
        default: 500
      foray_pg_jit:
        type: bool
        description: >
          Cluster-wide JIT compilation. Default off - this workload is many small PostGIS
          queries, not a few large analytical ones; JIT overhead tends to lose more than it
          saves at that shape.
        default: false
      foray_pg_max_parallel_workers_per_gather:
        type: int
        description: >
          0 on a 1-vCPU plan (no spare core to parallelize into); raise only alongside a
          bigger plan.
        default: 0
      foray_pg_work_mem_kb:
        type: int
        description: >-
          work_mem in KB, per sort/hash per connection. DO's managed config API caps this
          relative to the cluster's plan size - the smallest plan's ceiling is 1024.
        default: 1024
      foray_pg_shared_buffers_percentage:
        type: float
        description: shared_buffers as a percentage of the plan's RAM
        default: 25.0
      foray_pgbouncer_api_pool_size:
        type: int
        description: >
          Transaction-mode pool size for the API - api/app.py's pool has no session-scoped
          state carried across requests, so transaction mode is safe there.
        default: 10
      foray_pgbouncer_cron_pool_size:
        type: int
        description: >
          Session-mode pool size for cron/migration connections - the schema advisory lock and
          any per-job SET work_mem/maintenance_work_mem need a session, not just a transaction.
        default: 3
