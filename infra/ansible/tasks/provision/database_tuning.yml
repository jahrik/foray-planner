---
# Manual/opt-in only (foray:pg-tuning, never) - cluster-config + PgBouncer changes must never
# run as a side effect of a regular foray:provision/foray:deploy pass. Looks the cluster up by
# name (like droplet_resize.yml does for the droplet) rather than depending on a registered var
# from tasks/provision/database.yml's creation task, since that step is tag-filtered out on a
# standalone --tags foray:pg-tuning run.
#
# issue #333: this covers the cluster-config knobs DO's API actually exposes, plus creating the
# managed PgBouncer pools. Everything else in the issue - ALTER ROLE settings, per-table
# autovacuum, the unused-index audit, SP-GiST vs GiST, the PG major-version upgrade - isn't on
# this surface (or needs a `community.postgresql`-style direct-SQL collection this repo doesn't
# depend on yet) and stays a manual maintainer action.
- name: Look up the managed Postgres cluster
  digitalocean.cloud.database_clusters_info:
    token: "{{ foray_do_token }}"
  register: foray_pg_tuning_clusters_info

- name: Resolve the cluster's id and admin user
  ansible.builtin.set_fact:
    foray_pg_tuning_cluster_id: >-
      {{ (foray_pg_tuning_clusters_info.databases
          | selectattr('name', 'equalto', foray_do_db_cluster_name)
          | list | first | default({})).get('id') }}
    foray_pg_tuning_cluster_user: >-
      {{ (foray_pg_tuning_clusters_info.databases
          | selectattr('name', 'equalto', foray_do_db_cluster_name)
          | list | first | default({})).get('connection', {}).get('user') }}

- name: Fail if the cluster doesn't exist yet
  ansible.builtin.fail:
    msg: >-
      No database cluster named {{ foray_do_db_cluster_name }} - run foray:provision first to
      create it.
  when: not foray_pg_tuning_cluster_id

- name: Apply Postgres cluster-config tuning
  digitalocean.cloud.database_config:
    token: "{{ foray_do_token }}"
    cluster_id: "{{ foray_pg_tuning_cluster_id }}"
    config:
      log_min_duration_statement: "{{ foray_pg_log_min_duration_ms }}"
      track_io_timing: true
      jit: "{{ foray_pg_jit }}"
      max_parallel_workers_per_gather: "{{ foray_pg_max_parallel_workers_per_gather }}"
      work_mem: "{{ foray_pg_work_mem_kb }}"
      shared_buffers_percentage: "{{ foray_pg_shared_buffers_percentage }}"
      pg_stat_statements.track: all
  when: foray_pg_tuning_enabled

# Creating these pools doesn't change how the app connects today - see the comment on
# foray_pgbouncer_enabled in defaults/main.yml.
- name: Create API connection pool (transaction mode)
  digitalocean.cloud.database_connection_pool:
    token: "{{ foray_do_token }}"
    cluster_id: "{{ foray_pg_tuning_cluster_id }}"
    name: foray-api
    mode: transaction
    size: "{{ foray_pgbouncer_api_pool_size }}"
    db: "{{ foray_do_db_name }}"
    user: "{{ foray_pg_tuning_cluster_user }}"
  when: foray_pgbouncer_enabled

- name: Create cron/migration connection pool (session mode)
  digitalocean.cloud.database_connection_pool:
    token: "{{ foray_do_token }}"
    cluster_id: "{{ foray_pg_tuning_cluster_id }}"
    name: foray-cron
    mode: session
    size: "{{ foray_pgbouncer_cron_pool_size }}"
    db: "{{ foray_do_db_name }}"
    user: "{{ foray_pg_tuning_cluster_user }}"
  when: foray_pgbouncer_enabled
