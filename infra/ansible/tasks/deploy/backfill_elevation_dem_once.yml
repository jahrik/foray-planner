---
# Manual/opt-in only - not part of foray:deploy. The hourly foray-backfill-elevation cron
# (tasks/deploy/cron.yml) drains the per-observation elevation backlog through Open-Meteo's
# free API, but that tier caps at ~10k points/day - a multi-million-row backlog is ~200 days
# of trickle. This runs scripts/backfill_elevation_dem.py once instead: it samples the same
# Copernicus GLO-90 DEM from 1x1 degree tiles pulled onto the droplet, clearing the whole
# backlog in one pass (minutes of CPU once the ~5 GB of tiles are down). The tile cache is a
# throwaway working set - removed afterwards even if the run fails.
- name: Check for the deploy-rendered env file
  ansible.builtin.stat:
    path: /opt/foray-planner/foray.env
  register: foray_dem_once_env_stat

- name: Fail fast if this droplet has never been deployed to
  ansible.builtin.fail:
    msg: >-
      /opt/foray-planner/foray.env not found - run `make ansible-deploy` at least once on
      this droplet first (foray:backfill-elevation-dem-once depends on the env file it renders).
  when: not foray_dem_once_env_stat.stat.exists

# df rather than ansible_mounts: site.yml runs this play with gather_facts: false, so the
# fact isn't populated.
- name: Check free disk space for the DEM tile cache
  ansible.builtin.command:
    cmd: df -B1 --output=avail /
  register: foray_dem_once_df
  changed_when: false

- name: Fail fast if the droplet does not have room for the tile cache
  vars:
    foray_dem_once_free_gb: "{{ (foray_dem_once_df.stdout_lines[1] | trim | int) / (1024**3) }}"
  ansible.builtin.fail:
    msg: >-
      Only {{ foray_dem_once_free_gb | float | round(1) }} GB free on / - the DEM tile cache
      needs ~{{ foray_dem_once_min_free_gb }} GB. Free space or resize the droplet first.
  when: foray_dem_once_free_gb | float < foray_dem_once_min_free_gb | float

- name: Ensure the DEM tile cache directory exists
  ansible.builtin.file:
    path: "{{ foray_dem_once_cache_dir }}"
    state: directory
    # Owned by the container's `foray` uid (1000, see Dockerfile) so it can write tiles into
    # this bind mount - no world-writable bit needed. The host has no uid-1000 user; the
    # numeric id is fine.
    owner: "1000"
    group: "1000"
    mode: "0755"

# foray_app_image defaults to :latest, but CD deploys by digest and never moves the droplet's
# :latest tag - without this the one-off runs whatever stale :latest happens to be on the box
# (matches the pull in tasks/deploy/app.yml).
- name: Pull the current app image
  community.docker.docker_image_pull:
    name: "{{ foray_app_image }}"
    pull: always

- name: Run one-off DEM elevation backfill and clean up the tile cache afterwards
  block:
    - name: Run one-off DEM elevation backfill
      community.docker.docker_container:
        name: foray-backfill-elevation-dem-once
        image: "{{ foray_app_image }}"
        state: started
        detach: false
        cleanup: true
        env_file: /opt/foray-planner/foray.env
        env:
          FORAY_DEM_CACHE: /cache
        volumes:
          - "{{ foray_dem_once_cache_dir }}:/cache"
        # --no-rebuild: skip the in-line phenology rebuild (matches the hourly elevation cron) -
        # the daily foray-ingest cron rematerializes regions/phenology, so card elevation means
        # land within a day without a second heavy pass on the managed Postgres right after this.
        # --sleep: pace the COPY+UPDATE batches so the live server keeps its share of the DB.
        command: "python scripts/backfill_elevation_dem.py --no-rebuild --sleep 0.25"
      register: foray_dem_once_run

    # docker_container with detach:false does not fail the task on a non-zero container exit;
    # the script exits 1 if any tile failed to fetch (the rest are already written - re-run to
    # retry the failures).
    - name: Fail if the backfill container exited non-zero
      ansible.builtin.fail:
        msg: "backfill_elevation_dem.py exited {{ foray_dem_once_run.container.State.ExitCode }} - see the container output above; re-run to retry failed tiles."
      when: foray_dem_once_run.container.State.ExitCode | int != 0
  always:
    - name: Remove the DEM tile cache from the droplet
      ansible.builtin.file:
        path: "{{ foray_dem_once_cache_dir }}"
        state: absent
      when: not (foray_dem_once_keep_cache | bool)
