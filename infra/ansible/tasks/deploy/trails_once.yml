---
# Manual/opt-in only - not part of foray:deploy. Loads the newest staged OSM trails snapshot
# (issue #442, `.github/workflows/bulk-load.yml` stages it) now instead of waiting for the
# nightly `ingest-bulk-osm-trails` job: starts that job's own systemd unit, so it runs exactly
# as scheduled (job wrapper, writer cap, job_runs row, journal logs) and detached - this task
# returns at once rather than holding an SSH session open for the load.
#
# Replaced the coverage-wide Overpass crawl this task used to run (`foray refresh --with trails
# --all`), which the bulk source retired.
- name: Fail fast if the job's unit isn't installed yet
  ansible.builtin.stat:
    path: /etc/systemd/system/foray-ingest-bulk-osm-trails.service
  register: foray_trails_once_unit

- name: Require a deploy that installed the OSM trails bulk job
  ansible.builtin.fail:
    msg: >-
      foray-ingest-bulk-osm-trails.service not found - run `just ansible deploy` first (it
      generates the job units from jobs.yaml).
  when: not foray_trails_once_unit.stat.exists

- name: Start the OSM trails bulk load now (detached)
  ansible.builtin.systemd:
    name: foray-ingest-bulk-osm-trails.service
    state: started
    no_block: true
