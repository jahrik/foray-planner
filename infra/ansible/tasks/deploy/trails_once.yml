---
# Manual/opt-in only - not part of foray:deploy. The weekly foray-layers-land cron job
# (`layers-land` in jobs.yaml, `refresh --with camps,land,trails --all`) already re-pulls every
# coverage region and self-heals the issue #394 route/path duplicates via
# `cache.prune_duplicate_route_paths` on each pass - but at a 168h interval, a droplet with a
# lot of pre-#396 rows converges slowly. This runs just the trails target, once, across all
# coverage regions, to converge sooner instead of waiting on the cron's normal pace.
- name: Check for the deploy-rendered env file
  ansible.builtin.stat:
    path: /opt/foray-planner/foray.env
  register: foray_trails_once_env_stat

- name: Fail fast if this droplet has never been deployed to
  ansible.builtin.fail:
    msg: >-
      /opt/foray-planner/foray.env not found - run `just ansible deploy` at least once on
      this droplet first (foray:trails-once depends on the env file it renders).
  when: not foray_trails_once_env_stat.stat.exists

# foray_app_image defaults to :latest, but CD deploys by digest and never moves the droplet's
# :latest tag - without this the one-off runs whatever stale :latest happens to be on the box (#277).
- name: Pull the current app image
  community.docker.docker_image_pull:
    name: "{{ foray_app_image }}"
    pull: always

- name: Run one-off trails refresh across all coverage regions
  community.docker.docker_container:
    name: foray-trails-once
    image: "{{ foray_app_image }}"
    state: started
    detach: false
    cleanup: true
    env_file: /opt/foray-planner/foray.env
    command: "foray refresh --with trails --all"
