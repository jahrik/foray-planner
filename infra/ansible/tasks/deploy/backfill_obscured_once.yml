---
# Manual/opt-in only - not part of foray:deploy. Fast, immediate partial fix ahead of the much
# slower foray:resync-once catch-up - flags still-NULL `obscured` rows using the
# positional_accuracy fingerprint heuristic (see scripts/backfill_obscured.py, TODO.md). Safe to
# rerun (idempotent - only ever sets obscured=true, never false, and only touches still-NULL
# rows). One-time stopgap: delete this task + its Makefile target once prod's resync has swept
# every row at least once (see TODO.md's cleanup note).
- name: Check for the deploy-rendered env file
  ansible.builtin.stat:
    path: /opt/foray-planner/foray.env
  register: foray_backfill_obscured_once_env_stat

- name: Fail fast if this droplet has never been deployed to
  ansible.builtin.fail:
    msg: >-
      /opt/foray-planner/foray.env not found - run `make ansible-deploy` at least once on
      this droplet first (foray:backfill-obscured-once depends on the env file it renders).
  when: not foray_backfill_obscured_once_env_stat.stat.exists

- name: Run one-off obscured-coordinate heuristic backfill
  community.docker.docker_container:
    name: foray-backfill-obscured-once
    image: "{{ foray_app_image }}"
    state: started
    detach: false
    cleanup: true
    env_file: /opt/foray-planner/foray.env
    command: "python scripts/backfill_obscured.py"
