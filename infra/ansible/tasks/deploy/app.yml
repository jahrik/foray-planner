---
- name: Log in to GHCR
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ lookup('ansible.builtin.env', 'GHCR_USER', default='') }}"
    password: "{{ lookup('ansible.builtin.env', 'GHCR_TOKEN', default='') }}"
  when:
    - lookup('ansible.builtin.env', 'GHCR_TOKEN', default='') | length > 0
    - lookup('ansible.builtin.env', 'GHCR_USER', default='') | length > 0

- name: Pull latest container image
  # community.docker.docker_image (source: pull, force_source: true) leaves the local
  # `:latest` tag pointing at whatever was pulled last time - it downloads the new layers
  # but doesn't move the tag, so ad hoc tasks referencing foray_app_image directly (e.g.
  # backfill_obscured_once.yml, resync_once.yml) silently run a stale image. The dedicated
  # docker_image_pull module (community.docker docs recommend it over docker_image) talks to
  # the daemon's pull endpoint directly and does move the tag, matching plain `docker pull`.
  community.docker.docker_image_pull:
    name: "{{ foray_app_image }}"
    pull: always

- name: Check if env file exists
  ansible.builtin.stat:
    path: /opt/foray-planner/foray.env
  register: foray_env_stat

- name: Write environment file
  ansible.builtin.template:
    src: foray.env.j2
    dest: /opt/foray-planner/foray.env
    mode: "0600"
    owner: root
    group: root
  when: foray_db_host is defined or not foray_env_stat.stat.exists
  notify: restart foray

- name: Run foray-planner container
  community.docker.docker_container:
    name: "{{ foray_app_container_name }}"
    image: "{{ foray_app_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ foray_docker_network }}"
    env_file: /opt/foray-planner/foray.env
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  register: foray_container
