---
# Grafana dashboards as code (issue #338 PR 3) - the dashboard JSON model lives in the repo
# (templates/grafana-dashboard.json.j2) and gets pushed via the Grafana HTTP API on every
# deploy, so it survives a stack recreate and any UI edit gets clobbered back to the committed
# version rather than drifting silently. Skipped when either credential is unset - same opt-in
# pattern as observability.yml, and independent of it (a dashboard needs the Grafana API
# service-account token, not the Mimir remote_write token observability.yml uses).

- name: Look up the Grafana Cloud Prometheus datasource
  ansible.builtin.uri:
    url: "{{ foray_grafana_cloud_url }}/api/datasources"
    method: GET
    headers:
      Authorization: "Bearer {{ foray_grafana_cloud_sa_token }}"
    return_content: true
  register: foray_grafana_datasources
  when:
    - foray_grafana_cloud_url | trim | length > 0
    - foray_grafana_cloud_sa_token | trim | length > 0
  # Authorization header carries the service-account token.
  no_log: true

- name: Set the Prometheus datasource UID fact
  when:
    - foray_grafana_cloud_url | trim | length > 0
    - foray_grafana_cloud_sa_token | trim | length > 0
  vars:
    # Grafana Cloud auto-provisions two type=prometheus datasources: the real metrics one, and
    # "grafanacloud-usage" for its own usage-insights metrics - exclude the latter by name, or
    # every dashboard query silently returns "No data" against usage insights instead of our
    # own metrics (found live after deploy, PR #383).
    foray_grafana_prom_sources: "{{ foray_grafana_datasources.json | selectattr('type', 'equalto', 'prometheus') | rejectattr('name', 'search', 'usage') | list }}"
    # Prefer the default datasource if there's more than one Prometheus source, else the first
    # (Copilot review, PR #383).
    foray_grafana_prom_default_sources: "{{ foray_grafana_prom_sources | selectattr('isDefault', 'defined') | selectattr('isDefault') | list }}"
  block:
    - name: Fail cleanly if no Prometheus datasource is provisioned
      ansible.builtin.fail:
        msg: >-
          No datasource of type "prometheus" (excluding Grafana Cloud's own
          "grafanacloud-usage" usage-insights source) found at {{ foray_grafana_cloud_url }} -
          this likely means the stack isn't fully set up yet, or the service-account token
          can't see it.
      when: foray_grafana_prom_sources | length == 0

    - name: Set the Prometheus datasource UID fact
      ansible.builtin.set_fact:
        # A single-line expression, deliberately - a multi-line {% set %} + {{ }} inside a
        # YAML folded (">-") scalar gets a literal space injected between the lines by YAML's
        # own line-folding, *before* Jinja ever runs, producing a UID with a leading space that
        # Grafana silently fails to resolve (every panel's datasource picker showed blank -
        # found live after deploy, PR #383/#384).
        foray_grafana_prom_datasource_uid: "{{ (foray_grafana_prom_default_sources[0] if foray_grafana_prom_default_sources else foray_grafana_prom_sources[0]).uid | trim }}"

- name: Push the Foray Planner overview dashboard
  ansible.builtin.uri:
    url: "{{ foray_grafana_cloud_url }}/api/dashboards/db"
    method: POST
    headers:
      Authorization: "Bearer {{ foray_grafana_cloud_sa_token }}"
    body_format: json
    body: "{{ lookup('ansible.builtin.template', 'grafana-dashboard.json.j2') | from_json }}"
    status_code: [200]
  when:
    - foray_grafana_cloud_url | trim | length > 0
    - foray_grafana_cloud_sa_token | trim | length > 0
  no_log: true
