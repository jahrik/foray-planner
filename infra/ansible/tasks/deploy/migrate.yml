---
# issue #332: a dedicated migrate-once step, run before app.yml starts the new app container
# (or a systemd job unit gets a chance to fire) - every job container and the API instance
# already call `connect()`/`apply_schema` on every start, which raced fine when a migration
# was additive, but a schema-breaking migration (e.g. #268 PR5's DROP COLUMN) mid-rollout can
# make a stale container's own apply_schema fail. Running it exactly once here, against the
# new image, before anything else on the new image starts, removes that race.
- name: Check for the deploy-rendered env file
  ansible.builtin.stat:
    path: /opt/foray-planner/foray.env
  register: foray_migrate_env_stat

- name: Write environment file (first deploy on this droplet)
  ansible.builtin.template:
    src: foray.env.j2
    dest: /opt/foray-planner/foray.env
    mode: "0600"
    owner: root
    group: root
  when: not foray_migrate_env_stat.stat.exists

- name: Pull the app image that's about to be deployed
  community.docker.docker_image_pull:
    name: "{{ foray_app_image }}"
    pull: always

# A schema-breaking migration must not run while the old image is still up - it's still
# serving requests (app container) and any in-flight systemd job unit (issue #332 PR 2,
# tasks/deploy/systemd_jobs.yml) is still able to fire against the new schema. Mirrors app.yml's
# own docker_container (state present/absent) replace pattern rather than a raw `docker stop`.
- name: Stop the app container before migrating
  community.docker.docker_container:
    name: "{{ foray_app_container_name }}"
    state: absent

# Job containers are named foray-<job-name> (per jobs.yaml, not hand-listed here - the whole
# point of the #332 PR 2 manifest is that this file doesn't need to know the job list) and
# systemd re-starts each one on its own timer, so re-running its unit after this migration
# needs nothing further from here. Catch by image (`ancestor`) rather than by name so a
# stray/renamed job's container is swept too, regardless of what it's called.
- name: Find any other still-running container on the app image (in-flight job runs)
  community.docker.docker_host_info:
    containers: true
    containers_filters:
      ancestor: "{{ foray_app_image }}"
      status: running
  register: foray_migrate_stray_containers

- name: Stop stray app-image containers before migrating
  community.docker.docker_container:
    name: "{{ item.Id }}"
    state: absent
  loop: "{{ foray_migrate_stray_containers.containers }}"
  loop_control:
    label: "{{ item.Names | default([item.Id]) | first }}"

# digitalocean.cloud.database_config (tasks/provision/database.yml) issues a fresh PATCH on
# every run regardless of whether the values actually changed (the module always reports
# changed=true, never diffs), and DO puts the cluster's primary into a read-only recovery state
# while that config apply lands - a `foray migrate` that races this window fails with
# psycopg.errors.ReadOnlySqlTransaction. Retry instead of failing outright: on the smallest plan
# (db-s-1vcpu-1gb) this observably took longer than a minute to clear, so the budget here is
# generous (up to 8 minutes) rather than tuned tight to the common case.

- name: Run the one-shot schema migration
  community.docker.docker_container:
    name: foray-migrate-once
    image: "{{ foray_app_image }}"
    state: started
    detach: false
    cleanup: true
    networks:
      - name: "{{ foray_docker_network }}"
    env_file: /opt/foray-planner/foray.env
    command: "foray migrate"
  register: foray_migrate_once_run
  # docker_container's registered result shape isn't consistent enough to key a retry off of:
  # observed both a `container.State.ExitCode` shape and a bare `{"Output": "..."}` shape with
  # no `State` at all on the very same task across attempts. Success requires *positive*
  # evidence - an explicit exit code of 0, or Output present as a string with no traceback in
  # it - rather than just the absence of a traceback: a docker-level failure with neither
  # `State` nor `Output` populated must retry/fail, not be treated as a silent success.
  until: >-
    ((foray_migrate_once_run.container | default({})).get('State', {}).get('ExitCode') == 0)
    or (((foray_migrate_once_run.container | default({})).get('Output')) is string
        and 'Traceback (most recent call last):' not in (foray_migrate_once_run.container | default({})).get('Output'))
  retries: 16
  delay: 30

# docker_container with detach:false does not fail the task on a non-zero container exit -
# without this a failed migration is reported as successful and app.yml deploys the new image
# against a half-migrated schema anyway. Same success check as the retry `until` above, inverted.
- name: Fail if the migration container did not succeed
  ansible.builtin.fail:
    msg: >-
      foray migrate did not succeed after retries (exit code
      {{ (foray_migrate_once_run.container | default({})).get('State', {}).get('ExitCode', 'unknown') }}) -
      see the container output above:
      {{ (foray_migrate_once_run.container | default({})).get('Output', 'no output captured') }}
  when: >-
    not (
      ((foray_migrate_once_run.container | default({})).get('State', {}).get('ExitCode') == 0)
      or (((foray_migrate_once_run.container | default({})).get('Output')) is string
          and 'Traceback (most recent call last):' not in (foray_migrate_once_run.container | default({})).get('Output'))
    )
