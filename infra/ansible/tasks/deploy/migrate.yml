---
# issue #332: a dedicated migrate-once step, run before app.yml starts the new app container
# (or cron.yml's scripts get a chance to fire) - every cron container and the API instance
# already call `connect()`/`apply_schema` on every start, which raced fine when a migration
# was additive, but a schema-breaking migration (e.g. #268 PR5's DROP COLUMN) mid-rollout can
# make a stale container's own apply_schema fail. Running it exactly once here, against the
# new image, before anything else on the new image starts, removes that race.
- name: Check for the deploy-rendered env file
  ansible.builtin.stat:
    path: /opt/foray-planner/foray.env
  register: foray_migrate_env_stat

- name: Write environment file (first deploy on this droplet)
  ansible.builtin.template:
    src: foray.env.j2
    dest: /opt/foray-planner/foray.env
    mode: "0600"
    owner: root
    group: root
  when: not foray_migrate_env_stat.stat.exists

- name: Pull the app image that's about to be deployed
  community.docker.docker_image_pull:
    name: "{{ foray_app_image }}"
    pull: always

# A schema-breaking migration must not run while the old image is still up - it's still
# serving requests (app container) and cron.yml's scripts are still able to fire (their
# docker run commands are named, below) against the new schema. Mirrors app.yml's own
# docker_container (state present/absent) replace pattern rather than a raw `docker stop`.
# cron.yml re-renders and re-runs on every deploy right after app.yml, so nothing here needs
# to bring these back - a container only exists at all while one happens to be running.
- name: Stop the app + any in-flight cron containers before migrating
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop:
    - "{{ foray_app_container_name }}"
    - foray-cron-ingest
    - foray-cron-layers-camps
    - foray-cron-layers-land
    - foray-cron-genera
    - foray-cron-revalidate
    - foray-cron-resync
    - foray-cron-backfill-elevation

# The named stop above only catches containers started from a cron template that already names
# itself - true on every deploy after this PR, but not the very first one: a cron tick that fired
# under the previous (anonymous `docker run`) templates just before this deploy is still
# unnamed and would otherwise keep running `apply_schema` against the old image mid-migration.
# Catch those by image (`ancestor`) too, regardless of name, so the one-time transition is safe.
- name: Find any other still-running container on the app image (unnamed legacy cron runs)
  community.docker.docker_host_info:
    containers: true
    containers_filters:
      ancestor: "{{ foray_app_image }}"
      status: running
  register: foray_migrate_stray_containers

- name: Stop stray app-image containers before migrating
  community.docker.docker_container:
    name: "{{ item.Id }}"
    state: absent
  loop: "{{ foray_migrate_stray_containers.containers }}"
  loop_control:
    label: "{{ item.Names | default([item.Id]) | first }}"

- name: Run the one-shot schema migration
  community.docker.docker_container:
    name: foray-migrate-once
    image: "{{ foray_app_image }}"
    state: started
    detach: false
    cleanup: true
    networks:
      - name: "{{ foray_docker_network }}"
    env_file: /opt/foray-planner/foray.env
    command: "foray migrate"
  register: foray_migrate_once_run

# docker_container with detach:false does not fail the task on a non-zero container exit -
# without this a failed migration is reported as successful and app.yml deploys the new image
# against a half-migrated schema anyway.
- name: Fail if the migration container exited non-zero
  ansible.builtin.fail:
    msg: "foray migrate exited {{ foray_migrate_once_run.container.State.ExitCode }} - see the container output above."
  when: foray_migrate_once_run.container.State.ExitCode | int != 0
