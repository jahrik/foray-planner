---
# Manual/opt-in only - not part of foray:deploy. Populates region_satellite (#293) so a
# destination's satellite fill never pays a cold-cache tile-stitch on a live request. Esri's
# tile CDN throttles a wide fan-out, so `foray backfill-satellite` paces itself and retries -
# a full national-scale run is tens of minutes, and the CLI exits non-zero (failing this task)
# if failures dominate, so re-run until it's clean. No downtime handling needed unlike
# backfill-elevation-dem-once. Safe to re-run - a plain run only fetches regions still missing;
# pass foray_satellite_backfill_args=--refresh to clear the table first and re-fetch everything
# (after a change to what a region's raster should contain - bbox, zoom, tiles, compositing).
- name: Check for the deploy-rendered env file
  ansible.builtin.stat:
    path: /opt/foray-planner/foray.env
  register: foray_backfill_satellite_once_env_stat

- name: Fail fast if this droplet has never been deployed to
  ansible.builtin.fail:
    msg: >-
      /opt/foray-planner/foray.env not found - run `just ansible deploy` at least once on
      this droplet first (foray:backfill-satellite-once depends on the env file it renders).
  when: not foray_backfill_satellite_once_env_stat.stat.exists

# foray_app_image defaults to :latest, but CD deploys by digest and never moves the droplet's
# :latest tag - without this the one-off runs whatever stale :latest happens to be on the box (#277).
- name: Pull the current app image
  community.docker.docker_image_pull:
    name: "{{ foray_app_image }}"
    pull: always

- name: Run one-off satellite backfill
  community.docker.docker_container:
    name: foray-backfill-satellite-once
    image: "{{ foray_app_image }}"
    state: started
    detach: false
    cleanup: true
    env_file: /opt/foray-planner/foray.env
    command: "foray backfill-satellite {{ foray_satellite_backfill_args | default('') }}"
