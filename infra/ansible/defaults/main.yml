---
# Digital Ocean API token — never set here in a public repo; pass via
# environment variable DO_API_TOKEN or --extra-vars at runtime.
foray_do_token: "{{ lookup('ansible.builtin.env', 'DO_API_TOKEN') }}"

# Region for all DO resources (droplet + managed database)
foray_do_region: sfo3

# Droplet configuration
foray_do_droplet_name: foray-planner
foray_do_droplet_size: s-1vcpu-2gb
foray_do_droplet_image: docker-20-04
foray_do_ssh_key_name: ""

# Managed Postgres cluster
foray_do_db_cluster_name: foray-postgres
# db-s-1vcpu-1gb's fixed 10GB disk allocation filled up (~82%+, foray db alone at 8.25GB),
# putting DO's disk-protection read-only lockout on the whole cluster - bumped to the next tier
# up for its larger disk allocation. Only takes effect on an explicit `foray:db-resize` run
# (tasks/provision/database_resize.yml) - database_cluster's `present()` never diffs/updates
# size on an existing cluster.
foray_do_db_size: db-s-1vcpu-2gb
foray_do_db_engine: pg
foray_do_db_version: "17"
foray_do_db_name: foray

# Cluster-config tuning (issue #333) - applied via digitalocean.cloud.database_config as a
# standard part of foray:provision (idempotent, safe to re-apply). Values not on DO's config
# surface at all (ALTER ROLE random_page_cost/effective_io_concurrency and per-table autovacuum
# are in cache._MIGRATIONS instead, since the app's own DB role can set those itself;
# effective_cache_size, statement_timeout, the unused-index audit, SP-GiST vs GiST A/B, and the
# PG major-version upgrade stay manual - see infra/ansible/AGENTS.md) aren't here.
foray_pg_log_min_duration_ms: 500
foray_pg_jit: false
foray_pg_max_parallel_workers_per_gather: 0
foray_pg_work_mem_kb: 1024
foray_pg_shared_buffers_percentage: 25.0

# DO managed PgBouncer pools (issue #333), also created as a standard part of foray:provision.
# Creating the pool is non-disruptive by itself - the app keeps connecting directly to the
# cluster until FORAY_DATABASE_URL is deliberately repointed at a pool's own host/port, a
# separate, deliberate cutover not done here.
foray_pgbouncer_api_pool_size: 10
foray_pgbouncer_cron_pool_size: 3

# Container image (published by CD pipeline on every push to main)
foray_app_image: ghcr.io/jahrik/foray-planner:latest
foray_app_container_name: foray-planner
foray_docker_network: foray-net

# Caddy terminates TLS on 80/443 and reverse-proxies to the app container over the
# foray_docker_network - the app container itself no longer publishes a host port.
foray_domain: forayplanner.com
foray_caddy_container_name: foray-planner-caddy
foray_caddy_image: caddy:2-alpine

# Cloudflare Origin CA cert/key - generated in the Cloudflare dashboard, saved locally, and
# referenced here by path only; never committed or pasted into this repo.
foray_tls_cert_path: "{{ lookup('ansible.builtin.env', 'FORAY_TLS_CERT_PATH', default='') }}"
foray_tls_key_path: "{{ lookup('ansible.builtin.env', 'FORAY_TLS_KEY_PATH', default='') }}"

# Cloudflare Origin CA cert/key as inline content instead of a local path - used by CI, which
# has no access to the operator's filesystem. Sourced from FORAY_TLS_CERT/FORAY_TLS_KEY secrets.
# Leave unset for the local operator flow, which uses the *_path vars above instead.
foray_tls_cert_content: "{{ lookup('ansible.builtin.env', 'FORAY_TLS_CERT', default='') }}"
foray_tls_key_content: "{{ lookup('ansible.builtin.env', 'FORAY_TLS_KEY', default='') }}"

# RIDB API key — optional, campground ingest is skipped without it.
# Pass via environment or --extra-vars; never commit.
foray_ridb_api_key: "{{ lookup('ansible.builtin.env', 'RIDB_API_KEY') }}"

# App configuration (pydantic-settings env vars)
foray_home_lat: "47.6062"
foray_home_lng: "-122.3321"
foray_home_radius_km: "150"

# Scheduled jobs (issue #332 PR 2): the job list + per-job command + interval now live in
# jobs.yaml at the repo root (read by tasks/deploy/systemd_jobs.yml and by the dev-loop
# scheduler, src/foray/schedule.py) - not here. These vars only shape the systemd timer
# templates' night window / jitter, shared across every night-window / any-window job.
#
# Night window (TODO.md O2) - coverage-wide/heavy jobs only start inside this window.
foray_night_window_start_hour: "2"
foray_night_window_tz: America/Los_Angeles
# Spread night-window jobs across a 3h window so they don't all start at :00 together (the
# writer-cap semaphore, FORAY_OBSERVABILITY__WRITER_CAP, is the hard backstop if they still do).
foray_night_window_randomized_delay_sec: "10800"
# Light/any-window jobs get a much smaller jitter - they're meant to run close to on-schedule.
foray_job_randomized_delay_sec: "300"

# One-time foray:backfill-elevation-dem-once (clears the whole elevation backlog from local
# Copernicus GLO-90 tiles instead of Open-Meteo's ~10k/day free tier - see
# scripts/backfill_elevation_dem.py). The tile cache is a throwaway working set: bind-mounted
# here, removed after the run unless foray_dem_once_keep_cache is set (useful only to avoid a
# re-download when retrying a partially failed run).
foray_dem_once_cache_dir: /opt/foray-planner/dem-cache
# The real working set is ~4.7 GB of tiles; 6 leaves headroom without tripping on a droplet
# that is merely low, not out of room (the 8 GB guess blocked a run at 7.8 GB free).
foray_dem_once_min_free_gb: "6"
foray_dem_once_keep_cache: false

# One-time foray:resync-once catch-up - much larger than the recurring cron's batch size since
# this runs once, synchronously, until the whole table is
# caught up. Overrideable per droplet size/table growth (Copilot review, PR #185).
foray_resync_once_batch_size: "20000"

# One-time foray:backfill-geom-once (populate <table>.geom for rows predating PostGIS Phase 0,
# #268). Seconds to pause between UPDATE batches - keep non-zero when running against the live
# managed Postgres without the maintenance page up, 0 for a maintenance window.
foray_geom_once_sleep: "0.2"

# Firewall rules — restrict SSH to your IP/VPN CIDR (required, no default)
foray_do_firewall_name: foray-planner-fw
foray_ssh_allowed_ips: []

# Protomaps PMTiles vector basemap (the map's only base layer - the app ships no raster
# fallback). The archive is a single static object in a DO Space fronted by the Spaces CDN.
#
#   provision (foray:provision)          - create the Space + CDN endpoint, set CORS + a
#                                          public-read bucket policy. Skipped when the Spaces
#                                          keys below are unset.
#   build    (foray:build-basemap-once)  - `pmtiles extract` a US bbox from Protomaps' daily
#                                          planet build and upload it. Runs on localhost, not
#                                          the droplet (the extract is 15-40 GB).
#
# The Space data plane (create bucket, upload) needs a *Spaces access key*, which is separate
# from DO_API_TOKEN - generate one under API -> Spaces Keys and pass it as DO_SPACES_KEY /
# DO_SPACES_SECRET. DO_API_TOKEN is still used for the CDN endpoint + cache purge.
foray_spaces_access_key_id: "{{ lookup('ansible.builtin.env', 'DO_SPACES_KEY', default='') }}"
foray_spaces_secret_access_key: "{{ lookup('ansible.builtin.env', 'DO_SPACES_SECRET', default='') }}"
foray_basemap_space_name: foray-basemap
foray_basemap_region: "{{ foray_do_region }}"
foray_basemap_object_key: us.pmtiles
# Origins allowed to range-GET the archive cross-origin: prod, the local docker site, and the
# vite dev server. The archive is public-read open map data, so CORS here only lets a browser
# on these origins fetch() the bytes it could already curl - no exposure from the localhost
# entries (see docs/data-sources.md, "Local dev").
foray_basemap_allowed_origins:
  - "https://{{ foray_domain }}"
  - "http://localhost:8000"
  - "http://localhost:5173"
# CONUS + a margin: min_lon,min_lat,max_lon,max_lat.
foray_basemap_bbox: "-125,24,-66,50"
foray_basemap_cdn_ttl: "86400"
# Blank -> the build task auto-picks the most recent https://build.protomaps.com/<date>.pmtiles
# that resolves. Set to a specific archive URL or local path to override.
foray_basemap_source: ""
foray_pmtiles_version: "1.31.2"  # github.com/protomaps/go-pmtiles CLI, used for the extract
foray_basemap_workdir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/foray-basemap"
foray_basemap_cdn_url: "https://{{ foray_basemap_space_name }}.{{ foray_basemap_region }}.cdn.digitaloceanspaces.com/{{ foray_basemap_object_key }}"
# FORAY_BASEMAP_URL wins if set; otherwise default to the computed CDN URL once BOTH Spaces
# credentials are configured - the same condition provision/build check, so the fallback only
# points at the archive when the archive could actually have been created (before that, blank ->
# the map has no base layer, which is the intended pre-setup state).
foray_basemap_url: >-
  {{ lookup('ansible.builtin.env', 'FORAY_BASEMAP_URL', default='')
     or (foray_basemap_cdn_url
         if (foray_spaces_access_key_id | length > 0 and foray_spaces_secret_access_key | length > 0)
         else '') }}

# Terrain DEM tiles - Terrarium-encoded raster elevation, the source for the map's hillshade +
# contour lines. Points at AWS Open Data's `elevation-tiles-prod` set (3DEP ~10 m over CONUS,
# SRTM elsewhere; free, no key, CORS-open) rather than a self-hosted archive - a raster DEM
# pyramid does not compress and there is no pmtiles-extract shortcut for it, so self-hosting
# would be far more infra than the vector basemap for a lower-resolution result. Set
# FORAY_TERRAIN_URL to a self-hosted tile URL to override. (An unset OR empty env var falls
# back to the AWS default - the `or` guards against CI passing the secret through as an empty
# string, same pattern as foray_basemap_url.)
foray_terrain_url: >-
  {{ lookup('ansible.builtin.env', 'FORAY_TERRAIN_URL', default='')
     or 'https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png' }}

# DO monitoring alert policies (issue #84) — unset skips creation entirely (see
# tasks/provision/monitoring.yml). Thresholds mirror the values DO's own dashboard suggests;
# disk is the one that matters most here (past ENOSPC incident).
foray_alert_email: "{{ lookup('ansible.builtin.env', 'FORAY_ALERT_EMAIL', default='') }}"
foray_disk_alert_threshold_percent: 85
foray_cpu_alert_threshold_percent: 90
foray_memory_alert_threshold_percent: 90

# CI runner's public IP, added to/removed from the live SSH firewall rule around an automated
# deploy (foray:firewall-allow-runner / foray:firewall-revoke-runner tags). Never set locally.
foray_ci_runner_ip: ""

# CI runner's containing GitHub Actions CIDR block (computed by cd.yml from
# api.github.com/meta) - preferred over foray_ci_runner_ip since GitHub-hosted runners don't
# egress from one stable IP for a whole job. Never set locally.
foray_ci_runner_cidr: ""

# Cloudflare's published edge IP ranges — 80/443 on the droplet are restricted to these so the
# origin can't be reached directly, bypassing Cloudflare's TLS/WAF/rate-limiting. Sourced from
# https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 (checked 2026-07-14).
# Cloudflare changes these rarely; re-fetch and update here if origin traffic ever starts 403ing
# at the DO firewall level.
foray_cloudflare_ipv4:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
foray_cloudflare_ipv6:
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
