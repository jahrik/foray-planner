---
- name: Restart foray
  community.docker.docker_container:
    name: "{{ foray_app_container_name }}"
    image: "{{ foray_app_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    networks:
      - name: "{{ foray_docker_network }}"
    env_file: /opt/foray-planner/foray.env
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  listen: restart foray

- name: Restart caddy
  community.docker.docker_container:
    name: "{{ foray_caddy_container_name }}"
    image: "{{ foray_caddy_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/foray-planner/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/foray-planner/tls:/etc/caddy/tls:ro
    networks:
      - name: "{{ foray_docker_network }}"
  listen: restart caddy

- name: Restart martin
  community.docker.docker_container:
    name: "{{ foray_martin_container_name }}"
    image: "{{ foray_martin_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    command: ["--config", "/config.yaml"]
    # Kept in sync with tasks/deploy/martin.yml's own DATABASE_URL - see its comment.
    env:
      DATABASE_URL: "postgres://{{ foray_db_user | urlencode }}:{{ foray_db_password | urlencode }}@{{ foray_db_host }}:{{ foray_db_port }}/{{ foray_do_db_name }}"
    volumes:
      - /opt/foray-planner/martin-config.yaml:/config.yaml:ro
    networks:
      - name: "{{ foray_docker_network }}"
  listen: restart martin

- name: Restart node-exporter
  community.docker.docker_container:
    name: "{{ foray_node_exporter_container_name }}"
    image: "{{ foray_node_exporter_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - name: "{{ foray_docker_network }}"
  listen: restart node-exporter

- name: Restart postgres-exporter
  community.docker.docker_container:
    name: "{{ foray_postgres_exporter_container_name }}"
    image: "{{ foray_postgres_exporter_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    env:
      DATA_SOURCE_NAME: "postgresql://{{ foray_db_user | urlencode }}:{{ foray_db_password | urlencode }}@{{ foray_db_host }}:{{ foray_db_port }}/{{ foray_do_db_name }}?sslmode=require"
    networks:
      - name: "{{ foray_docker_network }}"
  listen: restart postgres-exporter
  no_log: true

- name: Restart alloy
  community.docker.docker_container:
    name: "{{ foray_alloy_container_name }}"
    image: "{{ foray_alloy_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=127.0.0.1:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - /opt/foray-planner/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - "foray-planner-alloy-data:/var/lib/alloy/data"
    networks:
      - name: "{{ foray_docker_network }}"
  listen: restart alloy
