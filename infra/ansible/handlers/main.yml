---
- name: Restart foray
  community.docker.docker_container:
    name: "{{ foray_app_container_name }}"
    image: "{{ foray_app_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    networks:
      - name: "{{ foray_docker_network }}"
    env_file: /opt/foray-planner/foray.env
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  listen: restart foray

- name: Restart caddy
  community.docker.docker_container:
    name: "{{ foray_caddy_container_name }}"
    image: "{{ foray_caddy_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/foray-planner/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/foray-planner/tls:/etc/caddy/tls:ro
    networks:
      - name: "{{ foray_docker_network }}"
  listen: restart caddy

- name: Restart martin
  community.docker.docker_container:
    name: "{{ foray_martin_container_name }}"
    image: "{{ foray_martin_image }}"
    state: started
    restart: true
    restart_policy: unless-stopped
    command: ["--config", "/config.yaml"]
    # Kept in sync with tasks/deploy/martin.yml's own DATABASE_URL - see its comment.
    env:
      DATABASE_URL: "postgres://{{ foray_db_user | urlencode }}:{{ foray_db_password | urlencode }}@{{ foray_db_host }}:{{ foray_db_port }}/{{ foray_do_db_name }}"
    volumes:
      - /opt/foray-planner/martin-config.yaml:/config.yaml:ro
    networks:
      - name: "{{ foray_docker_network }}"
  listen: restart martin
