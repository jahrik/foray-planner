---
# Local quality gate. Fast checks run on every commit; the full test + frontend build run
# on `git push` (pre-push stage) so commits stay quick. Needs `just` on PATH
# (uv tool install rust-just). Enable both stages once with:
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# ruff/ty/vulture are driven through `uv run` so their versions come from uv.lock (single
# source of truth); no separately pinned hook revs to drift.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture src/foray --min-confidence 80
        language: system
        types: [python]
        pass_filenames: false

      # Heavier gates - pre-push only. always_run (no type filter) so a push that only
      # touches justfile / pyproject / workflow / lockfiles is still gated - those files
      # change what the suite and the build do.
      - id: just-test
        name: just test
        entry: just test
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: frontend-check
        name: frontend lint + type-check + build
        entry: just frontend
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
