# Local dev stack. Production uses DO managed Postgres (see infra/ansible/).
x-postgres-env: &postgres-env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: foray
  PGPASSWORD: ${POSTGRES_PASSWORD:-foray}
  PGDATABASE: foray

# RIDB_API_KEY is optional (campground ingest is skipped without it); pass it through
# from the shell environment or a local .env file so `foray refresh`, whether triggered
# by the app's /api/refresh or the scheduler, can see it.
x-ridb-env: &ridb-env
  RIDB_API_KEY: ${RIDB_API_KEY:-}

# Vector basemap archive URL (PMTiles). Empty by default -> the map has no base layer. Set
# FORAY_BASEMAP_URL in .env to the deployed CDN archive (http://localhost:8000 is in its CORS
# allowlist) or to a same-origin local extract - see .env.example. Prod gets this from Ansible
# (infra/ansible/, foray_basemap_url).
x-basemap-env: &basemap-env
  FORAY_BASEMAP_URL: ${FORAY_BASEMAP_URL:-}

# DO Spaces access for the bulk-snapshot pipeline (issue #334) - `just bulk-stage`/`bulk-load`,
# and now `usfs_trails` (issue #335 PR 3a). DO_SPACES_KEY/DO_SPACES_SECRET are the credential
# names already used everywhere else (.env, .github/workflows/bulk-load.yml's GitHub secrets) -
# translated to the FORAY_SPACES__* shape `config.Settings.spaces` parses only here, at the
# point it reaches the container, same as that workflow already does. Bucket/region default to
# the same Space the basemap archive uses (infra/ansible/AGENTS.md).
x-spaces-env: &spaces-env
  FORAY_SPACES__ACCESS_KEY_ID: ${DO_SPACES_KEY:-}
  FORAY_SPACES__SECRET_ACCESS_KEY: ${DO_SPACES_SECRET:-}
  FORAY_SPACES__BUCKET: ${FORAY_SPACES_BUCKET:-foray-basemap}
  FORAY_SPACES__REGION: ${FORAY_SPACES_REGION:-sfo3}

# martin (below) is a standard part of this stack now, always reachable by its compose service
# name - not opt-in the way FORAY_BASEMAP_URL is, since there's no external archive to point at
# instead. FORAY_MARTIN_URL still exists so a `.env` can blank it out to disable the trails
# vector-tile route/layer without stopping the container - the `-` form (not `:-`) so an
# explicitly empty FORAY_MARTIN_URL in .env stays empty instead of falling back to the default
# (Copilot review, PR #368).
x-martin-env: &martin-env
  FORAY_MARTIN_URL: ${FORAY_MARTIN_URL-http://martin:3000}

x-runtime-build: &runtime-build
  context: .
  target: runtime

x-depends-postgres: &depends-postgres
  postgres:
    condition: service_healthy

services:
  postgres:
    # PostGIS-enabled build of postgres:17 (issue #268; bumped to 17 alongside the prod
    # DO managed cluster upgrade, issue #333). The image runs `CREATE EXTENSION postgis` in
    # template1 + $POSTGRES_DB at init; the schema migration also does `CREATE EXTENSION IF
    # NOT EXISTS postgis` so a pre-existing volume / the separate foray_test DB pick it up
    # too. Production uses DO managed Postgres, which ships PostGIS.
    #
    # Upgrading from an existing PG16 volume: Postgres refuses to start against a data
    # directory from a different major version - `docker compose down -v` (local dev data is
    # disposable/re-ingestable) to drop `foray-postgres-data` and let it recreate fresh.
    image: docker.io/postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: foray
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foray}
      POSTGRES_DB: foray
    ports:
      - "5432:5432"
    volumes:
      - foray-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foray"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      <<: *runtime-build
    ports:
      - "8000:8000"
    environment:
      <<: [*postgres-env, *ridb-env, *basemap-env, *spaces-env, *martin-env]
    depends_on:
      <<: *depends-postgres
    command: ["foray", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Vector tile server for our own PostGIS layers (issue #336 PR 1) - reads `trails` straight
  # out of Postgres and serves MVT tiles; the app proxies `/api/tiles/trails/...` to it
  # (api/routes/tiles.py) rather than exposing this container to the browser directly. Config
  # (infra/martin-config.yaml) is the same file prod mounts - only `trails` is published, not
  # martin's full auto-discovered table set.
  #
  # Depends on `app` being healthy, not just `postgres` - the `trails` table itself is created
  # by the app's startup migration chain (api/app.py's lifespan calls apply_schema before the
  # healthcheck passes), not by the postgis image's init. Waiting only on postgres let martin
  # start against a schema that didn't have `trails` yet on a fresh volume (Copilot review, PR
  # #368). `app` itself no longer depends on `martin` - nothing at app startup needs it up, the
  # proxy route just calls out to it lazily per request.
  martin:
    image: ghcr.io/maplibre/martin:v0.15.0
    environment:
      DATABASE_URL: postgres://foray:${POSTGRES_PASSWORD:-foray}@postgres:5432/foray
    volumes:
      - ./infra/martin-config.yaml:/config.yaml:ro
    command: ["--config", "/config.yaml"]
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy

  # Runs the same `jobs.yaml` manifest the prod systemd timers are generated from (issue #332
  # PR 2) - `foray scheduler` (src/foray/schedule.py). Per-job cadence lives in jobs.yaml now,
  # not env vars here.
  scheduler:
    profiles: [scheduler]
    build:
      <<: *runtime-build
    environment:
      <<: [*postgres-env, *ridb-env, *spaces-env]
    depends_on:
      <<: *depends-postgres
    command: ["foray", "scheduler"]

volumes:
  foray-postgres-data:
