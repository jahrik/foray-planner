[project]
name = "foray"
version = "0.1.0"
description = "Plan mushroom-hunting trips from iNaturalist observation phenology"
readme = "README.md"
authors = [{ name = "Wesley Gill", email = "jahrik@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyinaturalist>=0.19,<1.0",
    "psycopg[binary,pool]>=3.3.4,<4.0",
    "fastapi>=0.141.1,<1.0",
    "uvicorn[standard]>=0.52.1,<1.0",
    "pydantic-settings>=2.15.0,<3.0",
    "click>=8.1,<9.0",
    "httpx>=0.27,<1.0",
    "tqdm>=4.70.0,<5.0",
]

[project.scripts]
foray = "foray.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.16.2,<1.0",
    "ty>=0.0.70,<1.0",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
