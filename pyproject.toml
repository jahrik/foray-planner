[project]
name = "foray"
version = "0.1.0"
description = "Plan mushroom-hunting trips from iNaturalist observation phenology"
readme = "README.md"
authors = [{ name = "Wesley Gill", email = "jahrik@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyinaturalist>=0.19,<1.0",
    "psycopg[binary,pool]>=3.3.4,<4.0",
    "fastapi>=0.141.1,<1.0",
    # Pulled in transitively by starlette; declared explicitly because api/app.py imports it
    # directly to cap the sync-handler thread pool to the DB pool size.
    "anyio>=4.0,<5.0",
    "uvicorn[standard]>=0.52.4,<1.0",
    "pydantic-settings>=2.15.0,<3.0",
    "click>=8.1,<9.0",
    "httpx>=0.27,<1.0",
    # inat.py imports requests.exceptions and pyrate_limiter.exceptions directly (to catch
    # and re-raise them as typed errors); pin them explicitly rather than relying on
    # pyinaturalist to keep pulling them in.
    "requests>=2.32,<3.0",
    "pyrate-limiter>=2.10,<3.0",
    # sources/elevation_dem.py samples local Copernicus GLO-90 DEM tiles - the steady-state
    # elevation-backfill-dem cron job (jobs.yaml, daily). A genuine runtime dep, not a one-off
    # leftover: every job in jobs.yaml runs via the same `foray_app_image` the web server uses
    # (infra/ansible/templates/foray-job.service.j2 - `docker run ... {{ foray_app_image }}
    # foray job ...`), so there's no separate CLI-only image to move this out of.
    "rasterio>=1.4,<2.0",
    # sources/satellite.py stitches Esri XYZ map tiles into one raster per destination.
    "pillow>=12.3.0,<13.0",
    "sentry-sdk>=2.69.1",
    # schedule.py parses jobs.yaml (issue #332 PR 2) - already a transitive dep, declared
    # explicit since the app now imports it directly.
    "pyyaml>=6.0,<7.0",
    # spaces.py: S3-compatible client for DO Spaces (issue #334 PR 1) - region_satellite's
    # rasters and the bulk-snapshot staging path.
    "boto3>=1.34,<2.0",
    # ingest_bulk.py's future loaders (issue #334 PR 3, #335) query staged Parquet/GPKG
    # snapshots directly rather than loading them into Python first.
    "duckdb>=1.1,<2.0",
    # issue #359: the standard bulk-snapshot format (write_snapshot_parquet/read_snapshot_parquet
    # in foray.spaces) is Parquet, streamed via pyarrow.parquet.ParquetWriter/ParquetFile.
    "pyarrow>=23.0.1,<24.0",
    # usfs_trails.py's trail_geometry column: WKB bytes in the Parquet snapshot (compact, no
    # per-row JSON re-parse) round-tripped to/from the GeoJSON text the trails table's
    # ST_GeomFromGeoJSON trigger expects (see cache.upsert_trails).
    "shapely>=2.0,<3.0",
    # inat_bulk.py streams the live DwC-A archive as a single continuous GET and parses it
    # forward-only (no seeking to the central directory) - see that module's docstring for why
    # this replaced range reads. Zip64-aware, which observations.csv needs.
    "stream-unzip>=0.0.90,<1.0",
    # geo.py's Python-side H3 cell math (issue #337) - bindings for the same core H3 C library
    # the Postgres `h3` extension wraps, so app-side cell assignment (precip caching, planner
    # corridor math, the ranking candidate-cell disk) agrees with SQL-side (BINNED, regions)
    # without either one calling the other.
    "h3>=4.1,<5.0",
]

[project.scripts]
foray = "foray.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.16.4,<1.0",
    "ty>=0.0.74,<1.0",
    "vulture>=2.14,<3.0",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/I/UP/B/SIM/C4 as before, plus:
#   RUF  - Ruff-native rules (unused noqa, mutable defaults, implicit optional, ...)
#   PERF - obvious performance anti-patterns (try/except in loop, list() of comprehension)
#   PIE  - small idiom cleanups (unnecessary pass, dict-literal spread, ...)
#   PTH  - prefer pathlib over os.path
# ARG (unused arguments) deliberately left out: too many deliberate callback / test-stub /
# FastAPI-dependency signatures to be worth the per-line noqa churn.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "PIE", "PTH"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(callable)` in the signature;
# ruff already exempts Query/Path/Header/etc from B008 but not Depends. The API package
# (foray/api/) uses it for the pool + AppState accessors.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov-fail-under is a ratchet-only floor set a few points below the current number (~83%);
# raise it as coverage improves, never lower it.
addopts = "-q --cov=foray --cov-report=term-missing:skip-covered --cov-fail-under=78"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src/foray"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
