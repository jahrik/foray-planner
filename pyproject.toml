[project]
name = "foray"
version = "0.1.0"
description = "Plan mushroom-hunting trips from iNaturalist observation phenology"
readme = "README.md"
authors = [{ name = "Wesley Gill", email = "jahrik@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyinaturalist>=0.19,<1.0",
    "psycopg[binary,pool]>=3.3.4,<4.0",
    "fastapi>=0.141.1,<1.0",
    # Pulled in transitively by starlette; declared explicitly because api/app.py imports it
    # directly to cap the sync-handler thread pool to the DB pool size.
    "anyio>=4.0,<5.0",
    "uvicorn[standard]>=0.52.4,<1.0",
    "pydantic-settings>=2.15.0,<3.0",
    "click>=8.1,<9.0",
    "httpx>=0.27,<1.0",
    # inat.py imports requests.exceptions and pyrate_limiter.exceptions directly (to catch
    # and re-raise them as typed errors); pin them explicitly rather than relying on
    # pyinaturalist to keep pulling them in.
    "requests>=2.32,<3.0",
    "pyrate-limiter>=2.10,<3.0",
    "tqdm>=4.70.0,<5.0",
    "rasterio>=1.4,<2.0",
    # sources/satellite.py stitches Esri XYZ map tiles into one raster per destination.
    "pillow>=12.3.0,<13.0",
    "sentry-sdk>=2.69.1",
    # schedule.py parses jobs.yaml (issue #332 PR 2) - already a transitive dep, declared
    # explicit since the app now imports it directly.
    "pyyaml>=6.0,<7.0",
    # spaces.py: S3-compatible client for DO Spaces (issue #334 PR 1) - region_satellite's
    # rasters and the bulk-snapshot staging path.
    "boto3>=1.34,<2.0",
    # ingest_bulk.py's future loaders (issue #334 PR 3, #335) query staged Parquet/GPKG
    # snapshots directly rather than loading them into Python first.
    "duckdb>=1.1,<2.0",
]

[project.scripts]
foray = "foray.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.16.4,<1.0",
    "ty>=0.0.74,<1.0",
    "vulture>=2.14,<3.0",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/I/UP/B/SIM/C4 as before, plus:
#   RUF  - Ruff-native rules (unused noqa, mutable defaults, implicit optional, ...)
#   PERF - obvious performance anti-patterns (try/except in loop, list() of comprehension)
#   PIE  - small idiom cleanups (unnecessary pass, dict-literal spread, ...)
#   PTH  - prefer pathlib over os.path
# ARG (unused arguments) deliberately left out: too many deliberate callback / test-stub /
# FastAPI-dependency signatures to be worth the per-line noqa churn.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "PIE", "PTH"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(callable)` in the signature;
# ruff already exempts Query/Path/Header/etc from B008 but not Depends. The API package
# (foray/api/) uses it for the pool + AppState accessors.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov-fail-under is a ratchet-only floor set a few points below the current number (~83%);
# raise it as coverage improves, never lower it.
addopts = "-q --cov=foray --cov-report=term-missing:skip-covered --cov-fail-under=78"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src/foray"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
