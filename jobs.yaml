# Single source of truth for every scheduled `foray` job (issue #332 PR 2).
#
# Both the dev/compose scheduler loop (`foray scheduler`, src/foray/schedule.py) and the prod
# systemd timers (infra/ansible/tasks/deploy/systemd_jobs.yml, generated from this file) read
# this list - so the two paths can no longer drift the way scripts/scheduler.sh and
# infra/ansible/tasks/deploy/cron.yml did (the #332 finding: prod never ran fire/precip/forage,
# because each path kept its own hand-maintained job list).
#
# Fields:
#   name            - job id: `foray job <name> -- ...`, the job_runs key, the systemd unit
#                     suffix (foray-<name>.service/.timer), the docker container name.
#   command         - the `foray` subcommand + args to run (split on whitespace - no shell
#                     quoting needed, every arg here is a plain flag/value).
#   interval_hours  - expected cadence. For window: night jobs this must be 24 (daily) or a
#                     multiple of 168 (weekly) - the systemd generator maps it to an OnCalendar
#                     day-of-week, not a bare "every N hours" timer.
#   window          - "any": fires on its own interval at any hour (light/incremental jobs -
#                     small batches, external-API-paced, fine to run any time).
#                     "night": only starts inside the 02:00-05:00 America/Los_Angeles window
#                     (coverage-wide / heavy jobs - see issue #332 PR 2, O2 in TODO.md).
#   writer          - true if this job writes to Postgres (nearly all of them) - counts against
#                     the writer-cap semaphore (`foray.jobs`, FORAY_OBSERVABILITY__WRITER_CAP)
#                     so a night-window pile-up can't put more than a few concurrent writers on
#                     the 1-vCPU box at once. RandomizedDelaySec already spreads actual start
#                     times; the cap is the hard backstop.

jobs:
  - name: ingest
    command: ingest --countries
    interval_hours: 24
    window: night
    writer: true

  # Coverage-wide (--all), not the home-radius-only camps/dispersed pair the old
  # cron-layers.sh.j2 ran - that was itself the gap issue #332 named (RIDB campground coverage
  # never reached non-home regions; see `ingest_campgrounds_coverage`, cli.py's `refresh --all`
  # path). dispersed stays its own job (below) since it goes through a different CLI command
  # (`foray dispersed --all`), not `refresh --with dispersed --all`.
  - name: layers-land
    command: refresh --with camps,land,trails --all
    interval_hours: 168
    window: night
    writer: true

  - name: dispersed-coverage
    command: dispersed --all
    interval_hours: 168
    window: night
    writer: true

  - name: genera
    command: genera-refresh
    interval_hours: 168
    window: night
    writer: true

  - name: revalidate
    command: revalidate
    interval_hours: 168
    window: night
    writer: true

  - name: resync
    command: resync --batch-size 2000
    interval_hours: 1
    window: any
    writer: true

  - name: elevation-backfill
    command: backfill-elevation --limit 20000 --no-rebuild
    interval_hours: 1
    window: any
    writer: true

  # Steady-state DEM path (issue #334 PR 3, foray.sources.elevation_dem): samples local
  # Copernicus GLO-90 tiles instead of calling Open-Meteo, so it isn't rate-limited - the
  # elevation-backfill job above becomes a near-zero-cost safety net for whatever this can't
  # reach (obscured/non-research/exact-boundary rows, or a tile the mirror doesn't publish).
  # window: night since a run downloads tiles + does set-based COPY/UPDATE writes - same class
  # as the coverage-wide jobs below, not `any`'s light/externally-paced jobs.
  - name: elevation-backfill-dem
    command: backfill-elevation-dem
    interval_hours: 24
    window: night
    writer: true

  - name: precip-backfill
    command: backfill-precip
    interval_hours: 24
    window: any
    writer: true

  - name: refresh-precip
    command: refresh-precip
    interval_hours: 24
    window: any
    writer: true

  - name: fire
    command: fire
    interval_hours: 24
    window: any
    writer: true

  - name: forage-backfill
    command: backfill-forage --limit 20000
    interval_hours: 6
    window: any
    writer: true

  # Loads whatever `.github/workflows/bulk-load.yml`'s weekly stage run most recently
  # published (issue #334 PR 2) - a no-op most days (`ingest-bulk` compares against `meta`
  # before doing any real work), so daily is cheap insurance against missing a stage. Requires
  # `FORAY_SPACES__*` configured; unconfigured, the CLI command raises and this job just fails
  # loudly in job_runs rather than silently skipping (see foray.ingest_bulk).
  # `window: night` (not `any`, despite being a no-op most days): the day it actually has a new
  # snapshot to load it can insert hundreds of thousands of rows in one pass (`load_inat`'s
  # `insert_observations_if_missing` is safe to run alongside `ingest`/`resync` at any hour -
  # it never overwrites a row either already has - but it's still coverage-wide-sized write
  # volume, the same class as `layers-land`/`dispersed-coverage` below, not `any`'s "light,
  # externally-paced" jobs).
  - name: ingest-bulk-inat
    command: ingest-bulk inat
    interval_hours: 24
    window: night
    writer: true

  - name: ingest-bulk-ridb
    command: ingest-bulk ridb
    interval_hours: 24
    window: night
    writer: true

  # USFS Trail_NFS (issue #335 PR 3a) - "via `ingest-bulk`" per the issue, not a live
  # coverage-wide crawl on the droplet: GitHub Actions stages the whole national table
  # (.github/workflows/bulk-load.yml - defaults to staging every `ingest_bulk.STAGERS`-registered
  # source, so no FORAY_BULK_SOURCES repo-variable change was needed, see #357), this just loads
  # whatever's newest-published.
  - name: ingest-bulk-usfs-trails
    command: ingest-bulk usfs_trails
    interval_hours: 24
    window: night
    writer: true

  # USFS MVUM roads (issue #335 PR 3b) - the road counterpart to Trail_NFS above, same
  # ingest-bulk split. Carries the per-vehicle-class OHV-legality/open-season matrix that OSM's
  # trails.py can only guess at via barrier nodes and access/motor_vehicle tags.
  - name: ingest-bulk-usfs-mvum
    command: ingest-bulk usfs_mvum
    interval_hours: 24
    window: night
    writer: true

  # RAVG burn severity (issue #335 PR 4) - replaces the dead live MTBS severity fetch that used
  # to run inside `fire`'s own refresh (portal.mtbs.gov no longer resolves). Small (~1,400 rows
  # nationally) and enrichment-only (never creates fire_perimeters rows), but still `night`:
  # `apply_fire_severity` writes can touch every row in both the active and history lanes.
  - name: ingest-bulk-ravg
    command: ingest-bulk ravg
    interval_hours: 24
    window: night
    writer: true
