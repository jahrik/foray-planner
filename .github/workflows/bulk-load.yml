name: Bulk snapshot staging

# Weekly re-stage of bulk data sources (iNat GBIF DwC-A, RIDB, PAD-US, USFS Trail_NFS, MTBS/RAVG
# - issue #334 PR 2, #335) to the DO Space, via `foray stage-snapshot <source>`. Runs here
# rather than on the droplet: a source snapshot can be tens of GB, more disk/bandwidth than the
# 1-vCPU droplet should spend on a job that doesn't touch Postgres at all. `foray ingest-bulk`
# (a systemd timer via jobs.yaml, see issue #332) separately loads whatever's staged here into
# the database on its own schedule.
#
# Stages every source registered in `ingest_bulk.STAGERS` (`foray stage-snapshot --all`) by
# default - no repo variable to keep in sync with the code's own registry, which is exactly the
# gap issue #357 was filed over (`inat`/`ridb` went unstaged for weeks because nothing had set
# `vars.FORAY_BULK_SOURCES`). Set `vars.FORAY_BULK_SOURCES` (comma-separated) only to *narrow*
# the weekly run to a subset; leave it unset to stage everything registered.
#
# Stages into the *same* Space the deployed app reads from (infra/ansible/AGENTS.md,
# `foray_basemap_space_name`/`foray_basemap_region` - default bucket "foray-basemap", region
# the droplet's DO region), not a separate one: `vars.FORAY_SPACES_BUCKET`/`FORAY_SPACES_REGION`
# must be set to those same values (or left unset to use the same defaults) or a staged
# snapshot lands somewhere `foray ingest-bulk` on the droplet never looks.
#
# `environment: production` on the job below (matching cd.yml's `deploy` job) - DO_SPACES_KEY/
# DO_SPACES_SECRET live as Environment secrets under "production" in this repo, not repo-level
# secrets; without this, `secrets.DO_SPACES_KEY`/`DO_SPACES_SECRET` resolve empty here and every
# source fails to stage with "FORAY_SPACES__* not configured".
on:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "Stage a single source now (blank = every registered source, or FORAY_BULK_SOURCES if set)"
        required: false
        default: ""

# Copilot review (PR #361, issue #359): spaces.prune_other_snapshots deletes every object under
# bulk/{source}/ except the run it was just called for - two overlapping stage_snapshot calls
# for the same source (the weekly cron firing while someone manually dispatches, say) could then
# have one run's prune delete the other's not-yet-published objects, or a loader mid-download of
# one run see its objects vanish under a second run's prune. Rather than adding S3-level
# locking/leases inside stage_snapshot (extra complexity, and DO Spaces' conditional-write
# support isn't guaranteed), queue overlapping workflow runs instead - this is the only place
# `stage_snapshot` ever actually runs from, so serializing here closes the race at its one real
# entrypoint.
concurrency:
  group: bulk-snapshot-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: "ghcr.io/${{ github.repository }}"
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the current app image
        run: docker pull "$IMAGE:latest"

      - name: Stage each targeted source
        env:
          SOURCES: ${{ vars.FORAY_BULK_SOURCES }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source }}
          FORAY_SPACES__ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          FORAY_SPACES__SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          # Must match the deployed app's Space (infra/ansible defaults: foray-basemap / the
          # droplet's DO region) - see the comment above.
          FORAY_SPACES__BUCKET: ${{ vars.FORAY_SPACES_BUCKET || 'foray-basemap' }}
          FORAY_SPACES__REGION: ${{ vars.FORAY_SPACES_REGION || 'sfo3' }}
        run: |
          set -euo pipefail
          targets="${DISPATCH_SOURCE:-$SOURCES}"
          if [ -z "$targets" ]; then
            docker run --rm \
              -e FORAY_SPACES__ACCESS_KEY_ID \
              -e FORAY_SPACES__SECRET_ACCESS_KEY \
              -e FORAY_SPACES__BUCKET \
              -e FORAY_SPACES__REGION \
              "$IMAGE:latest" foray stage-snapshot --all
            exit 0
          fi
          IFS=',' read -ra list <<< "$targets"
          for source in "${list[@]}"; do
            docker run --rm \
              -e FORAY_SPACES__ACCESS_KEY_ID \
              -e FORAY_SPACES__SECRET_ACCESS_KEY \
              -e FORAY_SPACES__BUCKET \
              -e FORAY_SPACES__REGION \
              "$IMAGE:latest" foray stage-snapshot "$source"
          done
