version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /infra/ansible
    schedule:
      interval: weekly
    groups:
      ansible-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # maplibre-gl must stay on v5. v6 externalises its web worker as a separate
      # maplibre-gl-worker.mjs resolved from import.meta.url; Vite never emits it, so the
      # worker 404s at runtime and the vector basemap paints only its background - with no
      # build error, so a v6 bump passes CI while shipping a broken map. Revisit if the
      # Leaflet plugin / Vite gain a supported way to bundle the v6 worker.
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
